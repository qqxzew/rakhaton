[project]
name = "walking-legs-backend"
version = "0.1.0"
description = "PACS Comparator Check backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "intersystems-irispython>=5.4.1",
    "httpx>=0.28.1",
    "fastembed>=0.9.0",
    "sqlalchemy-iris>=0.18.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
